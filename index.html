// ---------------- Draw helpers ----------------
function drawRect(color, x, y, w, h, lw) {
    if (w < 0) { x += w; w = -w; }
    if (h < 0) { y += h; h = -h; }
    if (lw && lw > 0) {
        ctx.strokeStyle = color;
        ctx.lineWidth = lw;
        ctx.strokeRect(x + lw / 2, y + lw / 2, Math.max(w - lw, 0), Math.max(h - lw, 0));
    } else {
        ctx.fillStyle = color;
        ctx.fillRect(x, y, w, h);
    }
}

function drawLine(color, x1, y1, x2, y2, width) {
    ctx.strokeStyle = color;
    ctx.lineWidth = width;
    ctx.beginPath();
    ctx.moveTo(x1, y1);
    ctx.lineTo(x2, y2);
    ctx.stroke();
}

function drawPolygon(color, points) {
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.moveTo(points[0][0], points[0][1]);
    for (let i = 1; i < points.length; i++) ctx.lineTo(points[i][0], points[i][1]);
    ctx.closePath();
    ctx.fill();
}

// ---------------- Rect helper (mirrors pygame.Rect) ----------------
class Rect {
    constructor(x, y, w, h) { this.x = x; this.y = y; this.w = w; this.h = h; }
    get left() { return this.x; }
    set left(v) { this.x = v; }
    get right() { return this.x + this.w; }
    set right(v) { this.x = v - this.w; }
    get top() { return this.y; }
    set top(v) { this.y = v; }
    get bottom() { return this.y + this.h; }
    set bottom(v) { this.y = v - this.h; }
    get centerx() { return this.x + this.w / 2; }
    get centery() { return this.y + this.h / 2; }
    colliderect(o) {
        return this.x < o.x + o.w && this.x + this.w > o.x &&
               this.y < o.y + o.h && this.y + this.h > o.y;
    }
}

    ')': [[0,0],[1,1],[1,2],[1,3],[0,4]],
    '/': [[2,0],[1,1],[1,2],[1,3],[0,4]]
};

function drawPixelText(text, x, y, size, color) {
    size = size || 3;
    color = color || WHITE;
    let currentX = x;
    for (const ch of text.toUpperCase()) {
        const pixels = PIXEL_ALPHABET[ch];
        if (pixels) {
            for (const [px, py] of pixels) {
                drawRect(color, currentX + px * size, y + py * size, size, size);
            }
        }
        currentX += 4 * size;
    }
}

// ---------------- Characters ----------------
const CHARACTERS = [

    { name: "LUKE", color: SABER_GREEN, ability: "SABER THROW", max_health: 250, speed: 7, jump: -18, weapon: "GREEN_SABER", attack_type: "SABER_SWING" },

// ---------------- Special Projectile ----------------
class SpecialProjectile {
    constructor(x, y, direction, color, p_type, owner) {
        if (p_type === "FORCE PUSH") this.rect = new Rect(x, y - 30, 25, 90);
        else if (p_type === "SABER THROW") this.rect = new Rect(x, y + 10, 40, 40);
        else if (p_type === "BLASTER") this.rect = new Rect(x, y + 15, 30, 8);
        else if (p_type === "FORCE CHOKE") this.rect = new Rect(x, y + 40, 60, 20);
        else if (p_type === "DUAL THROW") this.rect = new Rect(x, y + 5, 80, 16);
        else if (p_type === "LIGHTNING") this.rect = new Rect(x, y, 65, 35);
        else if (p_type === "FORCE LIGHTNING") this.rect = new Rect(x, y + 10, 80, 45);
        else this.rect = new Rect(x, y, 35, 15);

        if (p_type === "BLASTER") this.speed = 18 * direction;
        else if (p_type === "FORCE PUSH") this.speed = 9 * direction;
        else if (p_type === "FORCE LIGHTNING") this.speed = 11 * direction;
        else this.speed = 12 * direction;

        this.color = color;
        this.p_type = p_type;
        this.active = true;
        this.animation_tick = 0;
        this.owner = owner;
    }

    update() {
        this.rect.x += this.speed;
        this.animation_tick++;
        if (this.rect.right < 0 || this.rect.left > SCREEN_WIDTH) this.active = false;
    }

    draw() {
        this.animation_tick++;
        const r = this.rect;
        if (this.p_type === "FORCE PUSH") {
            drawRect(LUKE_BLUE, r.x, r.y, r.w, r.h, 4);
            drawRect(WHITE, r.x + 8, r.y + 10, 8, r.h - 20);
        } else if (this.p_type === "SABER THROW") {
            drawRect(SABER_GREEN, r.x, r.y, r.w, r.h);
            drawRect(WHITE, r.x, r.y, r.w, r.h, 3);
        } else if (this.p_type === "BLASTER") {
            drawRect(VADER_RED, r.x, r.y, r.w, r.h);
            drawRect(WHITE, r.x + 5, r.y + 2, r.w - 10, 4);
        } else if (this.p_type === "FORCE CHOKE") {
            drawRect(PURPLE, r.x, r.y, r.w, r.h);
            if (this.animation_tick % 4 < 2) drawRect(BLACK, r.x + 10, r.y + 4, r.w - 20, 12);
        } else if (this.p_type === "DUAL THROW") {
            drawRect(MAUL_RED, r.x, r.y, r.w, r.h);
            drawRect(GRAY, r.x + 30, r.y - 4, 20, 24);
            drawRect(WHITE, r.x + 5, r.y + 4, r.w - 10, 8);
        } else if (this.p_type === "FORCE LIGHTNING") {
            drawLine(LIGHTNING_YELLOW, r.left, r.centery, r.left + 20, r.top, 5);
            drawLine(LIGHTNING_YELLOW, r.left + 15, r.centery, r.left + 35, r.bottom, 5);
            drawLine(WHITE, r.left + 10, r.centery, r.right, r.centery, 4);
            drawLine(LIGHTNING_YELLOW, r.left + 35, r.centery, r.right - 10, r.top + 8, 4);
            drawLine(LIGHTNING_YELLOW, r.left + 40, r.centery, r.right - 5, r.bottom - 8, 4);
        } else if (this.p_type === "LIGHTNING") {
            if (this.animation_tick % 2 === 0) {
                drawRect(LIGHTNING_YELLOW, r.x, r.y, r.w, r.h);
                drawRect(WHITE, r.x + 6, r.y + 6, r.w - 12, r.h - 12);
            } else {
                drawRect(WHITE, r.x, r.y, r.w, r.h);
                drawRect(LIGHTNING_YELLOW, r.x + 4, r.y + 4, r.w - 8, r.h - 8);
            }
        }
    }
}

function drawLightsaber(x, y, direction, color, length, double) {
    length = length || 55;
    const saber_h = 7, hilt_w = 15, hilt_h = 10;
    if (direction > 0) {
        drawRect(GRAY, x, y - 3, hilt_w, hilt_h);
        drawRect(color, x + hilt_w, y, length, saber_h);
        drawRect(WHITE, x + hilt_w + 5, y + 2, length - 10, 2);
        if (double) {
            drawRect(color, x - length, y, length, saber_h);
            drawRect(WHITE, x - length + 5, y + 2, length - 10, 2);
        }
    } else {
        drawRect(GRAY, x - hilt_w, y - 3, hilt_w, hilt_h);
        drawRect(color, x - hilt_w - length, y, length, saber_h);
        drawRect(WHITE, x - hilt_w - length + 5, y + 2, length - 10, 2);
        if (double) {
            drawRect(color, x, y, length, saber_h);
            drawRect(WHITE, x + 5, y + 2, length - 10, 2);
        }
    }
}

// ---------------- Input state ----------------
const keysDown = new Set();
const CONTROL_KEYS = new Set(['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown', ' ']);

function normKey(e) {
    return e.key.length === 1 ? e.key.toLowerCase() : e.key;
}

// ---------------- Fighter ----------------
class Fighter {
    constructor(x, y, char_data, control_type) {
        this.name = char_data.name;
        this.color = char_data.color;
        this.ability = char_data.ability;
        this.weapon = char_data.weapon;
        this.control_type = control_type;
        this.attack_type = char_data.attack_type;

        this.health = char_data.max_health;
        this.max_health = char_data.max_health;
        this.speed = char_data.speed;
        this.jump_power = char_data.jump;

        this.width = 60;
        this.height = 110;
        this.rect = new Rect(x, y, this.width, this.height);
        this.vel_x = 0;
        this.vel_y = 0;
        this.gravity = 1;
        this.is_grounded = false;

        this.facing_right = x < SCREEN_WIDTH / 2;
        this.is_attacking = false;
        this.attack_cooldown = 0;
        this.attack_duration = 0;
        this.attack_rect = null;
        this.special_cooldown = 0;
        this.force_choked = false;
        this.force_choke_timer = 0;
        this.force_choke_velocity = 0;

        this.hitstun_frames = 0;
        this.knockback_vel = 0;
    }

    take_damage(damage_amount, standard_attack) {
        if (standard_attack === undefined) standard_attack = true;
        this.health -= damage_amount;
        const direction_multiplier = this.facing_right ? -1 : 1;
        if (standard_attack) {
            this.hitstun_frames = 12;
            this.knockback_vel = 14 * direction_multiplier;
        } else {
            this.hitstun_frames = 20;
            this.knockback_vel = 22 * direction_multiplier;
        }
    }

    move(opponent_rect, projectiles_list) {
        this.vel_x = 0;

        if (this.force_choked) {
            this.force_choke_timer -= 1;
            this.rect.y -= 2;
            this.rect.x += this.force_choke_velocity;
            if (this.rect.left < 0) this.rect.left = 0;
            if (this.rect.right > SCREEN_WIDTH) this.rect.right = SCREEN_WIDTH;
            if (this.force_choke_timer <= 0) {
                this.force_choked = false;
                this.vel_y = 0;
            }
            this.tick_cooldown_counters();
            return;
        }

        if (this.hitstun_frames <= 0) {
            this.facing_right = this.rect.centerx < opponent_rect.centerx;
        }

        if (this.hitstun_frames > 0) {
            this.vel_x = this.knockback_vel;
            this.knockback_vel *= 0.85;
            this.hitstun_frames -= 1;
            this.apply_physics_and_boundaries();
            this.tick_cooldown_counters();
            return;
        }

        if (this.control_type === "player_1") {
            if (keysDown.has('ArrowLeft')) this.vel_x = -this.speed;
            if (keysDown.has('ArrowRight')) this.vel_x = this.speed;
            if (keysDown.has('ArrowUp') && this.is_grounded) { this.vel_y = this.jump_power; this.is_grounded = false; }
            if (keysDown.has(' ') && this.attack_cooldown === 0) this.attack();
            if (keysDown.has('m') && this.special_cooldown === 0) this.use_special(projectiles_list);
        } else if (this.control_type === "player_2") {
            if (keysDown.has('a')) this.vel_x = -this.speed;
            if (keysDown.has('d')) this.vel_x = this.speed;
            if (keysDown.has('w') && this.is_grounded) { this.vel_y = this.jump_power; this.is_grounded = false; }
            if (keysDown.has('f') && this.attack_cooldown === 0) this.attack();
            if (keysDown.has('g') && this.special_cooldown === 0) this.use_special(projectiles_list);
        } else if (this.control_type === "cpu") {
            const distance = Math.abs(this.rect.centerx - opponent_rect.centerx);
            if (distance > 250 && this.special_cooldown === 0 && Math.random() < 0.05) {
                this.use_special(projectiles_list);
            } else if (distance > 110) {
                if (this.rect.centerx < opponent_rect.centerx) this.vel_x = this.speed - 2;
                else this.vel_x = -(this.speed - 2);
            } else {
                if (this.attack_cooldown === 0 && Math.random() < 0.08) this.attack();
                if (this.is_grounded && Math.random() < 0.02) { this.vel_y = this.jump_power; this.is_grounded = false; }
            }
        }

        this.apply_physics_and_boundaries();
        this.tick_cooldown_counters();
    }

    apply_physics_and_boundaries() {
        this.vel_y += this.gravity;
        this.rect.x += this.vel_x;
        this.rect.y += this.vel_y;

        if (this.rect.bottom >= SCREEN_HEIGHT - 50) {
            this.rect.bottom = SCREEN_HEIGHT - 50;
            this.vel_y = 0;
            this.is_grounded = true;
        }
        if (this.rect.left < 0) this.rect.left = 0;
        if (this.rect.right > SCREEN_WIDTH) this.rect.right = SCREEN_WIDTH;
    }

    tick_cooldown_counters() {
        if (this.attack_cooldown > 0) this.attack_cooldown -= 1;
        if (this.special_cooldown > 0) this.special_cooldown -= 1;
        if (this.is_attacking) {
            this.attack_duration -= 1;
            if (this.attack_duration <= 0) { this.is_attacking = false; this.attack_rect = null; }
        }
    }

    attack() {
        this.is_attacking = true;
        this.attack_duration = 10;
        this.attack_cooldown = 30;

        if (this.attack_type === "SABER_SWING") {
            const aw = 75, ah = 55;
            if (this.facing_right) this.attack_rect = new Rect(this.rect.right - 5, this.rect.y + 25, aw, ah);
            else this.attack_rect = new Rect(this.rect.left - aw + 5, this.rect.y + 25, aw, ah);
        } else if (this.attack_type === "GUNSHOT") {
            const aw = 55, ah = 30;
            if (this.facing_right) this.attack_rect = new Rect(this.rect.right, this.rect.y + 40, aw, ah);
            else this.attack_rect = new Rect(this.rect.left - aw, this.rect.y + 40, aw, ah);
        } else if (this.attack_type === "FORCE_LIGHTNING") {
            const aw = 65, ah = 70;
            if (this.facing_right) this.attack_rect = new Rect(this.rect.right, this.rect.y + 20, aw, ah);
            else this.attack_rect = new Rect(this.rect.left - aw, this.rect.y + 20, aw, ah);
        }
    }

    apply_force_choke() {
        this.force_choked = true;
        this.force_choke_timer = 45;
        this.force_choke_velocity = 0;
    }

    use_special(projectiles_list) {
        if (this.special_cooldown > 0) return;
        this.special_cooldown = 90;
        const direction = this.facing_right ? 1 : -1;
        const spawn_x = this.facing_right ? this.rect.right : this.rect.left - 40;
        const p = new SpecialProjectile(spawn_x, this.rect.y + 30, direction, this.color, this.ability, this);
        projectiles_list.push(p);
    }

    draw() {
        const x = this.rect.x, y = this.rect.y;

        if (this.name === "OBI-WAN") {
            drawRect(BROWN, x + 16, y, 28, 7);
            drawRect(BROWN, x + 12, y + 6, 8, 12);
            drawRect(BEIGE, x + 18, y + 7, 24, 22);
            drawRect(BEIGE, x + 14, y + 13, 4, 8);
            drawRect(BEIGE, x + 42, y + 13, 4, 8);
            drawRect(BROWN, x + 18, y + 7, 24, 4);
            drawRect(BLACK, x + 22, y + 15, 3, 3);
            drawRect(BLACK, x + 35, y + 15, 3, 3);
            drawRect(BROWN, x + 27, y + 19, 7, 3);
            drawRect(BROWN, x + 22, y + 22, 16, 7);

        drawRect(HEALTH_GREEN, 50, 30, p1.health * p1_ratio, 25);
    }
    drawPixelText(p1.name, 50, 5, 2, p1.color);

    drawRect('rgb(100,0,0)', SCREEN_WIDTH - 400, 30, 350, 25);

        const p2_ratio = 350 / p2.max_health;
        drawRect(HEALTH_GREEN, SCREEN_WIDTH - 400, 30, p2.health * p2_ratio, 25);
    }
    const p2_lbl = p2.control_type === "cpu" ? `${p2.name} (CPU)` : p2.name;
    drawPixelText(p2_lbl, SCREEN_WIDTH - 250, 5, 2, p2.color);
}

// ---------------- Music ----------------
const menuMusic = new Audio('Music/menu_music.mp3');
const battleMusic = new Audio('Music/battle_music.mp3');
menuMusic.loop = true;
battleMusic.loop = true;
menuMusic.volume = 0.5;
battleMusic.volume = 0.5;

function playMusic(track) {
    menuMusic.pause();
    battleMusic.pause();
    try {
        track.currentTime = 15.0;
    } catch (e) { /* not loaded yet */ }
    track.play().catch(() => { /* blocked until user interacts; retried on next keypress */ });
}

// ---------------- Core game state ----------------
let game_mode = "MENU";
let opponent_mode = "CPU";
let selected_map = 0;
let p1_selected_idx = 0;
let p2_selected_idx = 3;

let p1_fighter = null;
let p2_fighter = null;
let projectiles = [];
let gameFocused = false;

canvas.addEventListener('pointerdown', () => {
    const wasUnfocused = !gameFocused;
    gameFocused = true;
    canvas.focus();

    // Resume the current music only when the player clicks back into the game.
    if (wasUnfocused) {
        const track = game_mode === "GAME" ? battleMusic : menuMusic;
        track.play().catch(() => {});
    }
});

// Clicking or switching away from the browser window pauses the game.
function unfocusGame() {
    gameFocused = false;
    keysDown.clear();
    menuMusic.pause();
    battleMusic.pause();
}

window.addEventListener('blur', unfocusGame);
document.addEventListener('visibilitychange', () => {
    if (document.hidden) unfocusGame();
});

canvas.addEventListener('click', (e) => {
    const rect = canvas.getBoundingClientRect();
    const x = (e.clientX - rect.left) * SCREEN_WIDTH / rect.width;
    const y = (e.clientY - rect.top) * SCREEN_HEIGHT / rect.height;
    if (game_mode !== "MENU" && x >= SCREEN_WIDTH - 135 && x <= SCREEN_WIDTH - 30 && y >= 565 && y <= 593) {
        returnToMenu();
    }
});

window.addEventListener('keydown', (e) => {
    if (!gameFocused) return;
    if (CONTROL_KEYS.has(e.key)) e.preventDefault();
    const key = normKey(e);
    keysDown.add(key);
    handleKeyDown(key);
});

window.addEventListener('keyup', (e) => {
    if (!gameFocused) return;
    const key = normKey(e);
    keysDown.delete(key);
});

function returnToMenu() {
    p1_fighter = null;
    p2_fighter = null;
    projectiles = [];
    game_mode = "MENU";
    playMusic(menuMusic);
}

function handleKeyDown(key) {
    if (key === 'Escape' && game_mode !== "MENU") {
        returnToMenu();
        return;
    }
    if (game_mode === "MENU") {
        if (key === '1') { opponent_mode = "CPU"; game_mode = "CHAR_SELECT"; playMusic(menuMusic); }
        else if (key === '2') { opponent_mode = "PLAYER2"; game_mode = "CHAR_SELECT"; playMusic(menuMusic); }
    } else if (game_mode === "CHAR_SELECT") {
        if (key === 'ArrowLeft') p1_selected_idx = (p1_selected_idx - 1 + CHARACTERS.length) % CHARACTERS.length;
        else if (key === 'ArrowRight') p1_selected_idx = (p1_selected_idx + 1) % CHARACTERS.length;

        if (opponent_mode === "PLAYER2") {
            if (key === 'a') p2_selected_idx = (p2_selected_idx - 1 + CHARACTERS.length) % CHARACTERS.length;
            else if (key === 'd') p2_selected_idx = (p2_selected_idx + 1) % CHARACTERS.length;
        } else {
            p2_selected_idx = Math.floor(Math.random() * CHARACTERS.length);
            while (p2_selected_idx === p1_selected_idx) {
                p2_selected_idx = Math.floor(Math.random() * CHARACTERS.length);
            }
        }

        if (key === 'Enter') game_mode = "MAP_SELECT";
    } else if (game_mode === "MAP_SELECT") {
        if (key === 'ArrowLeft') selected_map = 0;
        else if (key === 'ArrowRight') selected_map = 1;
        else if (key === 'Enter') {
            p1_fighter = new Fighter(200, 400, CHARACTERS[p1_selected_idx], "player_1");
            const p2_ctrl = opponent_mode === "CPU" ? "cpu" : "player_2";
            p2_fighter = new Fighter(740, 400, CHARACTERS[p2_selected_idx], p2_ctrl);
            projectiles = [];
            playMusic(battleMusic);
            game_mode = "PLAYING";
        }
    } else if (game_mode === "GAMEOVER") {
        if (key === 'r') {
            returnToMenu();
        }
    }
}

function drawCharSelect() {
    drawPixelText("SELECT YOUR FIGHTER", 260, 40, 4, WHITE);

    for (let i = 0; i < CHARACTERS.length; i++) {
        const char = CHARACTERS[i];
        const row = Math.floor(i / 3), col = i % 3;
        const bx = 120 + col * 270, by = 130 + row * 190;

        drawRect(FLOOR_COLOR, bx, by, 220, 160);
        drawPixelText(char.name, bx + 15, by + 15, 2, char.color);
        drawPixelText("POWER:", bx + 15, by + 110, 1, GRAY);
        drawPixelText(char.ability, bx + 15, by + 130, 1, WHITE);

        if (i === p1_selected_idx) {
            drawRect(LUKE_BLUE, bx - 4, by - 4, 228, 168, 4);
            drawPixelText("(P1)", bx + 160, by + 15, 2, LUKE_BLUE);
        }
        if (i === p2_selected_idx && opponent_mode === "PLAYER2") {
            drawRect(VADER_RED, bx - 8, by - 8, 236, 176, 3);
            drawPixelText("(P2)", bx + 160, by + 40, 2, VADER_RED);
            drawPixelText("P1: USE LEFT/RIGHT ARROWS TO MOVE CURSOR", 180, 510, 2, LUKE_BLUE);
        }
    }
    if (opponent_mode === "PLAYER2") {
        drawPixelText("P2: USE (A) / (D) KEYS TO CHOOSE FIGHTER", 180, 535, 2, VADER_RED);
    }
    drawPixelText("PRESS [ENTER] TO COMMENCE BATTLE", 270, 565, 2, HEALTH_GREEN);
}

function drawExitButton() {
    drawRect(BLACK, SCREEN_WIDTH - 135, 565, 105, 28);
    drawRect(VADER_RED, SCREEN_WIDTH - 135, 565, 105, 28, 2);
    drawPixelText("EXIT [ESC]", SCREEN_WIDTH - 125, 574, 2, WHITE);
}

function drawMapSelect() {
    drawPixelText("CHOOSE YOUR BATTLEFIELD", 245, 45, 4, WHITE);

    drawRect(BG_MID, 100, 150, 350, 220);
    drawRect(BG_LIGHT, 100, 150, 350, 8);
    for (let x = 120; x < 450; x += 80) drawRect(BG_LIGHT, x, 210, 45, 100);
    for (const [sx, sy, size] of STARS) {
        if (sx >= 100 && sx <= 450 && sy >= 150 && sy <= 370) drawRect(WHITE, sx, sy, size, size);
    }
    drawPixelText("ORIGINAL MAP", 180, 390, 2, LUKE_BLUE);

    drawRect('rgb(28,10,12)', 550, 150, 350, 220);
    drawRect('rgb(100,25,12)', 550, 220, 350, 150);
    drawPolygon('rgb(25,12,14)', [[550,330],[620,250],[690,330],[760,235],[830,330],[900,255],[900,370],[550,370]]);
    drawPolygon('rgb(220,60,8)', [[620,370],[680,370],[720,370],[800,370],[850,370],[900,370]]);
    drawPixelText("MUSTAFAR", 670, 390, 2, VADER_RED);

    if (selected_map === 0) drawRect(LUKE_BLUE, 90, 140, 370, 260, 5);
    else drawRect(VADER_RED, 540, 140, 370, 260, 5);

    drawPixelText("USE LEFT / RIGHT TO CHOOSE", 275, 470, 2, GRAY);
    drawPixelText("PRESS [ENTER] TO BATTLE", 300, 520, 2, HEALTH_GREEN);
}

// ---------------- Main loop ----------------
function gameLoop() {
    requestAnimationFrame(gameLoop);

    if (!gameFocused) {
        keysDown.clear();
        return;
    }

    if (selected_map === 0) {
        drawRect(BG_DARK, 0, 0, SCREEN_WIDTH, SCREEN_HEIGHT);
        drawRect(BG_MID, 0, 70, SCREEN_WIDTH, 230);
        drawRect(BG_LIGHT, 0, 70, SCREEN_WIDTH, 8);
        for (let x = 40; x < SCREEN_WIDTH; x += 160) {
            drawRect(BG_MID, x, 120, 80, 180);
            drawRect(BG_LIGHT, x + 15, 140, 50, 8);
            drawRect(BG_LIGHT, x + 15, 170, 50, 8);
            drawRect(BG_LIGHT, x + 15, 200, 50, 8);
        }
        for (const [sx, sy, size] of STARS) drawRect(WHITE, sx, sy, size, size);
    } else {
        drawMustafarBackground();
    }

    if (game_mode !== "MENU") drawExitButton();

    if (game_mode === "MENU") {
        drawPixelText("STAR WARS: RETRO DUEL", 200, 80, 5, WHITE);
        drawRect(LUKE_BLUE, 150, 200, 700, 65);
        drawPixelText("PRESS (1) FOR SINGLE PLAYER (VS CPU)", 180, 222, 3, WHITE);
        drawRect(VADER_RED, 150, 300, 700, 65);
        drawPixelText("PRESS (2) FOR LOCAL 2 PLAYER", 240, 322, 3, WHITE);
        drawRect(GRAY, 150, 410, 700, 120, 2);
        drawPixelText("CHOOSE MODE TO ENTER CHARACTER SELECTION", 210, 455, 2, GRAY);

    } else if (game_mode === "CHAR_SELECT") {
        drawCharSelect();

    } else if (game_mode === "MAP_SELECT") {
        drawMapSelect();

    } else if (game_mode === "PLAYING") {
        p1_fighter.move(p2_fighter.rect, projectiles);
        p2_fighter.move(p1_fighter.rect, projectiles);

        for (const p of projectiles) {
            p.update();

            if (p.owner === p1_fighter) {
                if (p.rect.colliderect(p2_fighter.rect)) {
                    if (p.p_type === "FORCE CHOKE") {
                        p2_fighter.apply_force_choke();
                        p2_fighter.force_choke_velocity = p1_fighter.facing_right ? 2 : -2;
                        p2_fighter.take_damage(20);
                    } else {
                        p2_fighter.take_damage(20);
                    }
                    p.active = false;
                }
            } else if (p.owner === p2_fighter) {
                if (p.rect.colliderect(p1_fighter.rect)) {
                    if (p.p_type === "FORCE CHOKE") {
                        p1_fighter.apply_force_choke();
                        p1_fighter.force_choke_velocity = p2_fighter.facing_right ? 2 : -2;
                        p1_fighter.take_damage(20);
                    } else {
                        p1_fighter.take_damage(20);
                    }
                    p.active = false;
                }
            }
        }
        projectiles = projectiles.filter(p => p.active);

        if (p1_fighter.is_attacking && p1_fighter.attack_rect && p1_fighter.attack_rect.colliderect(p2_fighter.rect)) {
            p2_fighter.take_damage(10, true);
            p1_fighter.is_attacking = false;
        }
        if (p2_fighter.is_attacking && p2_fighter.attack_rect && p2_fighter.attack_rect.colliderect(p1_fighter.rect)) {
            p1_fighter.take_damage(10, true);
            p2_fighter.is_attacking = false;
        }

        for (const p of projectiles) p.draw();
        p1_fighter.draw();
        p2_fighter.draw();
        drawHud(p1_fighter, p2_fighter);

        const p1_cooldown_lbl = p1_fighter.special_cooldown === 0 ? "READY" : "CHARGING";
        drawPixelText(`SPECIAL (M): ${p1_cooldown_lbl}`, 50, 60, 1, GRAY);
        if (p2_fighter.control_type === "player_2") {
            const p2_cooldown_lbl = p2_fighter.special_cooldown === 0 ? "READY" : "CHARGING";
            drawPixelText(`SPECIAL (G): ${p2_cooldown_lbl}`, SCREEN_WIDTH - 240, 60, 1, GRAY);
        }

        if (p1_fighter.health <= 0 || p2_fighter.health <= 0) game_mode = "GAMEOVER";

    } else if (game_mode === "GAMEOVER") {
        p1_fighter.draw();
        p2_fighter.draw();
        drawHud(p1_fighter, p2_fighter);

        drawRect(BLACK, 0, SCREEN_HEIGHT / 2 - 60, SCREEN_WIDTH, 120);
        drawRect(WHITE, 0, SCREEN_HEIGHT / 2 - 60, SCREEN_WIDTH, 120, 4);

        if (p1_fighter.health <= 0) {
            drawPixelText(`${p2_fighter.name} WINS!`, 320, SCREEN_HEIGHT / 2 - 35, 5, VADER_RED);
        } else {
            drawPixelText(`${p1_fighter.name} WINS!`, 320, SCREEN_HEIGHT / 2 - 35, 5, LUKE_BLUE);
        }
        drawPixelText("PRESS [R] TO RETURN TO MAIN MENU", 310, SCREEN_HEIGHT / 2 + 25, 2, GRAY);
    }
}

playMusic(menuMusic);
requestAnimationFrame(gameLoop);
</script>
</body>
